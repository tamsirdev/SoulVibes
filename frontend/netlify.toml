[build]
  command = "npm run build"
  publish = "dist/frontend"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/*"
  to = "https://soulvibe-backend.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "https://soulvibe-backend.railway.app/admin/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
